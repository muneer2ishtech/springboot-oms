#
spring.application.name=ishtech-springboot-oms-dev

## Actuator
management.endpoints.web.exposure.include=info,health,flyway,metrics

## DB
spring.datasource.name=ishtech_oms_dev_ds
spring.datasource.url=jdbc:mariadb://localhost:23306/ishtech_oms_dev_db
#spring.datasource.url=jdbc:mysql://localhost:13306/ishtech_oms_dev_db
spring.datasource.username=ishtech_oms_dev_user
spring.datasource.password=ishtech_oms_dev_pass
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## Flyway
spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=ishtech_oms_dev_flyway_user
spring.flyway.password=ishtech_oms_dev_flyway_pass
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.out-of-order=true
spring.flyway.placeholders.audit_schema_name=ishtech_oms_dev_aud_db

## JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#spring.jpa.properties.org.hibernate.envers.default_schema=ishtech_oms_dev_audit_db

## JWT
fi.ishtech.springboot.jwtauth.jwt.secret=NjJ4aDRZOGxQcXhoWDRVbE9IY3dnZ1FDcUJsekowdDhmYXRsQ3hab1lyQ0t3RjVqdEdFR3IwVHR2ZmVsdHIycw==
fi.ishtech.springboot.jwtauth.jwt.expirition-ms=600000
fi.ishtech.springboot.jwtauth.jwt.issuer=dev.oms.practice.ishtech.fi

## CORS

## Swagger
fi.ishtech.springboot.jwtauth.permit-swagger-urls=true

## Log
logging.level.:INFO
logging.level.org.flywaydb=TRACE
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.fi.ishtech=DEBUG
logging.level.fi.ishtech.practice.springboot.oms=TRACE
